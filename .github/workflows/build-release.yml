name: Build, test and engineering prerelease
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish an engineering prerelease (not a stable/human-qualified Homebrew submission)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, checked 2026-10-21
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Version consistency
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          v=pathlib.Path('VERSION').read_text().strip()
          assert json.load(open('app/appinfo.json'))['version']==v
          assert json.load(open('package.json'))['version']==v
          if os.environ.get('GITHUB_REF_TYPE')=='tag': assert os.environ['GITHUB_REF_NAME']=='v'+v
          PY
      - name: Native process, ALSA ABI, protocol, receiver and supervisor tests
        run: ./scripts/build.sh test
      - name: Browser integration against real native API (explicit test doubles)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Pinned official tools and ARM package
        run: |
          python3 scripts/fetch-tools.py
          ./scripts/build.sh package
      - name: Verify byte-reproducible IPK rebuild
        run: |
          cp dist/SHA256SUMS build/first-SHA256SUMS
          ./scripts/build.sh package
          cmp build/first-SHA256SUMS dist/SHA256SUMS
      - name: Source archive and release checksums
        run: |
          python3 scripts/source-release.py
          python3 scripts/release-checksums.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audiocast-engineering-prerelease
          path: |
            dist/*.ipk
            dist/*.manifest.json
            dist/*-source.tar.gz
            dist/SHA256SUMS
            build/proofs/
      - name: Publish only as engineering prerelease
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_prerelease == true)
        env:
          GH_TOKEN: ${{ github.token }}
        # A separate write-permission job is used below; no release token is passed to build code.
        run: echo 'Build artifacts ready; release job owns publication.'
  publish:
    needs: build
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_prerelease == true)
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download this run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download '${{ github.run_id }}' --repo '${{ github.repository }}' --name audiocast-engineering-prerelease --dir release-artifacts
      - name: Engineering prerelease, never automatic central-repo PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          if [ "$REF_TYPE" = tag ]; then tag=$REF_NAME; else tag="engineering-$version-${{ github.run_number }}"; fi
          gh release create "$tag" --repo "$REPOSITORY" --target '${{ github.sha }}' --prerelease \
            --title "AudioCast $version — hardware-unqualified engineering prerelease" \
            --notes-file docs/release-notes.md \
            release-artifacts/dist/*.ipk release-artifacts/dist/*.manifest.json \
            release-artifacts/dist/*-source.tar.gz release-artifacts/dist/SHA256SUMS
